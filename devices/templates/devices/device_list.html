{% extends "base.html" %}

{% block title %}Устройства - ТехСервис{% endblock %}

{% block content %}
    <div class="d-flex justify-content-between align-items-end mb-3">
        <div>
            <h1>Устройства</h1>
            <p class="text-secondary mb-0">
                Всего устройств: {{ devices|length }}
            </p>
        </div>
    </div>

    <div class="row g-3">
        {% for device in devices %}
            <div class="col-12 col-md-6">
                {% include "devices/includes/device_card.html" %}
            </div>
        {% empty %}
            <p>Устройства не найдены.</p>
        {% endfor %}
    </div>
{% endblock %}

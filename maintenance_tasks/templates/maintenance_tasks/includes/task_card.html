<article class="card task-card h-100">
    <div class="card-body d-flex flex-column">
        <div class="d-flex justify-content-between gap-3">
            <h2 class="h4 card-title">
                {{ task.title|default:"Без названия" }}
            </h2>
            {% include "maintenance_tasks/includes/task_status.html" %}
        </div>
        <p class="card-text">
            Плановая дата: {{ task.scheduled_date|date:"d.m.Y" }}
        </p>
        <p class="card-text text-secondary">
            Приоритет: {{ task.priority }}
        </p>
        <a
            href="{% url 'maintenance_tasks:detail' task.id %}"
            class="btn btn-primary mt-auto align-self-start"
        >
            Подробнее
        </a>
    </div>
</article>

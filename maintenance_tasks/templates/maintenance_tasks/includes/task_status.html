{% if task.status.value == "completed" %}
    <span class="badge task-status task-status-completed">Выполнено</span>
{% elif task.status.value == "cancelled" %}
    <span class="badge task-status task-status-cancelled">Отменено</span>
{% elif task.status.value == "in_progress" %}
    <span class="badge task-status task-status-progress">В работе</span>
{% else %}
    <span class="badge task-status task-status-planned">Запланировано</span>
{% endif %}

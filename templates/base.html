{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ТехСервис{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link
        rel="stylesheet"
        href="{% static 'homepage/css/style.css' %}"
    >
</head>
<body>
    <header class="site-header mb-4">
        <div class="container d-flex align-items-center gap-3 py-3">
            <img
                src="{% static 'homepage/img/logo.svg' %}"
                alt="Логотип ТехСервиса"
                class="site-logo"
            >
            <div>
                <div class="h4 mb-0">ТехСервис</div>
                <div class="text-secondary small">
                    Планирование обслуживания бытовой техники
                </div>
            </div>
        </div>
        {% include "includes/navigation.html" %}
    </header>

    <main class="container pb-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="container border-top py-3 text-secondary small">
        <span>© <span id="current-year"></span> ТехСервис</span>
    </footer>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
